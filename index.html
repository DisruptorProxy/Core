<!doctype html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

        <title>Disruptor Proxy</title>
        <meta name="description" content="A proxy client for Windows, Linux, macOS and Android, built on Xray-core."/>

        <link rel="icon" href="/src/assets/logo-icon.png"/>
        <link rel="stylesheet" href="/src/styles.css" />

        <!-- Resolve theme and direction before first paint. Applying them from the
            bundle would flash a light, LTR screen at a dark-mode Persian user.
            Mirrors src/stores/theme.ts and src/stores/locale.ts - keep keys in sync. -->
        <script>
            (() =>
            {
                const theme = localStorage.getItem('disruptor-proxy.theme') ?? 'system';
                const dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

                document.documentElement.classList.toggle('dark', dark);

                const locale = localStorage.getItem('disruptor-proxy.locale') ?? 'en';

                document.documentElement.lang = locale;
                // Must list every RTL locale in RTL_LOCALES (src/stores/locale.ts). Missing one
                // here does not mis-render the app - the store corrects `dir` once the bundle
                // runs - it flashes the wrong direction first, which is what this script exists
                // to prevent.
                document.documentElement.dir = locale === 'fa' || locale === 'ar' ? 'rtl' : 'ltr';
            })();
        </script>

        <!-- Deliberately `.ts`, not `.azeroth` (the file holds no component syntax anyway).
            Vite only transforms an unknown extension when the request carries
            `Sec-Fetch-Dest: script`, and the Android WebView omits that header on the
            requests Tauri proxies to the dev server - so a `.azeroth` entry came back as
            raw TypeScript with no MIME type, the WebView refused to run it as a module,
            and the app was a white screen on device while working fine in a browser.
            Every other `.azeroth` file is reached through an import, which Vite tags
            with `?import` and transforms regardless of headers. -->
        <script type="module" src="/src/main.ts" defer></script>
    </head>

    <body>
        <div id="root"></div>
    </body>
</html>
