version: 2

# Commit messages are prefixed `chore(deps)` on purpose: cliff.toml filters that scope out
# of the generated release notes, so routine bumps never show up in a user-facing changelog.
updates:
    -   package-ecosystem: npm
        directory: /
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        commit-message:
            prefix: chore(deps)
        groups:
            azerothjs:
                patterns:
                    - azerothjs
                    - "@azerothjs/*"
            dev-dependencies:
                dependency-type: development

    -   package-ecosystem: cargo
        directory: /src-tauri
        schedule:
            interval: weekly
        open-pull-requests-limit: 5
        commit-message:
            prefix: chore(deps)
        groups:
            tauri:
                patterns:
                    - tauri
                    - tauri-*

    -   package-ecosystem: github-actions
        directory: /
        schedule:
            interval: weekly
        commit-message:
            prefix: chore(deps)
