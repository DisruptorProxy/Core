name: Release

# Pushing a `v*` tag builds and signs every platform - Windows (NSIS + MSI), Linux (.deb +
# AppImage), macOS (universal .app + .dmg), and a best-effort Android APK - then publishes
# them to TWO places:
#   1. A draft release on THIS repo (DisruptorProxy/Core, private) - an internal
#      record, created by tauri-action using the default GITHUB_TOKEN (which can
#      only ever touch the repo the workflow runs in).
#   2. A draft release on DisruptorProxy/Xray-Client (public) - what real users and
#      the updater plugin actually see. tauri.conf.json's updater endpoint points at
#      Xray-Client/releases/latest/download/latest.json, so THIS is the publish that
#      makes auto-update work; Core's release does not.
#
# Release notes are generated from Conventional Commits by git-cliff (cliff.toml) and
# spliced into BOTH release bodies AND the updater's latest.json "notes". Checkout uses
# fetch-depth: 0 so git-cliff can see full history + tags.
#
# The updater manifest (latest.json) is BUILT HERE, not copied from Core: tauri-action
# only attaches its own latest.json to the Core release, and the download URL inside it
# points at Core (private) - useless to end users. The "Stage public artifacts" step
# below writes a fresh latest.json whose URLs point at the Xray-Client assets and whose
# signatures are read from each platform's .sig file. Artifacts are renamed to space-free
# names first, because GitHub mangles spaces in asset names and that would break the URL
# the updater fetches. Android is absent from the manifest on purpose - the Tauri updater
# has no Android channel, so the APK is a plain download.
#
# Both releases are created as DRAFTS on purpose - review each one on GitHub and publish
# it manually. A draft is invisible to the updater and to anonymous downloads
# (`releases/latest` only resolves to a PUBLISHED release), so a bad build never reaches
# anyone until you say so.
#
# Required secrets (Settings > Secrets and variables > Actions, on Core):
#   TAURI_SIGNING_PRIVATE_KEY           the updater signing key (base64 of the .key
#                                        file, exactly as `tauri signer generate` wrote
#                                        it - do not reformat).
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password.
#   CLIENT_REPO_TOKEN                   a token that can write to Xray-Client (a
#                                        fine-grained PAT scoped to only Xray-Client
#                                        with Contents: Read and write, or a classic PAT
#                                        with the `repo` scope). The default GITHUB_TOKEN
#                                        cannot publish to a different repo than the one
#                                        running the workflow.

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    # Linux builds on its own runner and hands its files to `release` as an artifact.
    # Only that job writes the releases, and it needs every platform staged together to
    # build ONE latest.json covering them all. macOS is deliberately absent: an unsigned,
    # un-notarized .app is blocked by Gatekeeper on every download, so it waits for a paid
    # Apple Developer account (it still builds in ci.yml, proving it bundles).
    linux:
        name: Build Linux (deb + AppImage)
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm

            -   uses: dtolnay/rust-toolchain@stable

            -   name: Install Linux Tauri dependencies
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

            -   run: npm ci

            # Only the Windows core is committed; every other target's is fetched and
            # sha256-verified at build time.
            -   name: Fetch the Linux Xray core
                run: node scripts/fetch-core.mjs --target linux-64

            -   name: Build the .deb + AppImage
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: npm run tauri build -- --bundles deb,appimage

            -   name: Stage the Linux artifacts
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')
                    $bundle  = 'src-tauri/target/release/bundle'

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # The AppImage is Linux's updater target. Find whichever file has a
                    # .sig beside it rather than assuming an extension - that way the name
                    # published here can never drift from the one that was actually signed.
                    $sig = Get-ChildItem "$bundle/appimage" -Filter '*.sig' | Select-Object -First 1
                    if (-not $sig) { throw "Updater signature (.sig) not found under $bundle/appimage" }

                    $payloadFile = Get-ChildItem "$bundle/appimage" |
                        Where-Object { $_.Name -eq ($sig.Name -replace '\.sig$', '') } |
                        Select-Object -First 1
                    if (-not $payloadFile) { throw "Updater payload for $($sig.Name) not found" }

                    # Space-free names: productName is "The Disruptor Proxy", and GitHub
                    # mangles spaces in asset names - which would break the updater's URL.
                    $suffix      = if ($payloadFile.Name -like '*.tar.gz') { 'AppImage.tar.gz' } else { 'AppImage' }
                    $payloadName = "Disruptor-Proxy_${version}_amd64.$suffix"
                    Copy-Item $payloadFile.FullName (Join-Path $out $payloadName)
                    Copy-Item $sig.FullName         (Join-Path $out "$payloadName.sig")

                    # The .deb is a direct-download convenience; the updater never uses it.
                    $deb = Get-ChildItem "$bundle/deb" -Filter '*.deb' | Select-Object -First 1
                    if ($deb) { Copy-Item $deb.FullName (Join-Path $out "Disruptor-Proxy_${version}_amd64.deb") }

                    Write-Host "Staged Linux artifacts:"
                    Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

            -   uses: actions/upload-artifact@v4
                with:
                    name: linux-assets
                    path: release-assets
                    if-no-files-found: error

    macos:
        name: Build macOS (universal .app + .dmg)
        runs-on: macos-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm

            -   uses: dtolnay/rust-toolchain@stable
                with:
                    targets: aarch64-apple-darwin,x86_64-apple-darwin

            -   run: npm ci

            # A universal app needs a universal core. Xray ships one binary per arch, so
            # fetch both and lipo them together - otherwise the app would launch on both
            # Macs but only be able to run its proxy on one of them.
            -   name: Fetch and fuse the macOS Xray cores
                run: |
                    node scripts/fetch-core.mjs --target macos-arm64-v8a
                    mv src-tauri/assets/app-xray "$RUNNER_TEMP/app-xray-arm64"
                    node scripts/fetch-core.mjs --target macos-64
                    mv src-tauri/assets/app-xray "$RUNNER_TEMP/app-xray-x86_64"
                    lipo -create "$RUNNER_TEMP/app-xray-arm64" "$RUNNER_TEMP/app-xray-x86_64" \
                         -output src-tauri/assets/app-xray
                    chmod +x src-tauri/assets/app-xray
                    lipo -info src-tauri/assets/app-xray

            # UNSIGNED and un-notarized: that needs a paid Apple Developer account. macOS
            # will warn on first launch until then (documented on the wiki's install page).
            -   name: Build the universal .app + .dmg
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

            -   name: Stage the macOS artifacts
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')
                    $bundle  = 'src-tauri/target/universal-apple-darwin/release/bundle'

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # The .app.tar.gz is macOS's updater target - same trick as Linux: take
                    # whichever file has a .sig beside it, never a guessed extension.
                    $sig = Get-ChildItem "$bundle/macos" -Filter '*.sig' | Select-Object -First 1
                    if (-not $sig) { throw "Updater signature (.sig) not found under $bundle/macos" }

                    $payloadFile = Get-ChildItem "$bundle/macos" |
                        Where-Object { $_.Name -eq ($sig.Name -replace '\.sig$', '') } |
                        Select-Object -First 1
                    if (-not $payloadFile) { throw "Updater payload for $($sig.Name) not found" }

                    $payloadName = "Disruptor-Proxy_${version}_universal.app.tar.gz"
                    Copy-Item $payloadFile.FullName (Join-Path $out $payloadName)
                    Copy-Item $sig.FullName         (Join-Path $out "$payloadName.sig")

                    # The .dmg is the direct download; the updater never uses it.
                    $dmg = Get-ChildItem "$bundle/dmg" -Filter '*.dmg' | Select-Object -First 1
                    if ($dmg) { Copy-Item $dmg.FullName (Join-Path $out "Disruptor-Proxy_${version}_universal.dmg") }

                    Write-Host "Staged macOS artifacts:"
                    Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

            -   uses: actions/upload-artifact@v4
                with:
                    name: macos-assets
                    path: release-assets
                    if-no-files-found: error

    android:
        name: Build Android (apk)
        # Best-effort on purpose: the release APK is signed only when the keystore secrets
        # are present, and Android won't install an unsigned APK - so an unsigned build is
        # attached for testing rather than distribution. continue-on-error keeps a broken or
        # missing Android build from blocking a desktop release; `needs` is still satisfied.
        runs-on: ubuntu-latest
        continue-on-error: true
        # `secrets` cannot be referenced from a step `if:`, but `env` can - so surface the
        # keystore secret the signing step gates on here, and test env.* below.
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm

            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 17

            -   uses: android-actions/setup-android@v3

            -   name: Install the Android NDK
                run: |
                    sdkmanager "ndk;27.0.12077973"
                    echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

            -   uses: dtolnay/rust-toolchain@stable
                with:
                    targets: aarch64-linux-android,x86_64-linux-android

            -   name: Install Linux Tauri dependencies
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

            -   run: npm ci

            # The Android core is libXray's prebuilt gomobile AAR (Xray-core in-process); no
            # tun2socks and no per-ABI native build - the fd goes straight to Xray's tun inbound.
            -   name: Fetch the Android Xray core (libXray AAR)
                run: npm run fetch-core:android

            # Android refuses to install an unsigned APK. When these secrets are absent the
            # gradle config leaves the build unsigned rather than failing, so the job still
            # proves the APK assembles - it just is not installable.
            -   name: Restore the signing keystore
                if: env.ANDROID_KEYSTORE_BASE64 != ''
                shell: bash
                run: |
                    echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
                    echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            -   name: Assemble the APK
                env:
                    ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                    ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                    ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                run: npm run tauri android build -- --apk

            -   name: Stage the Android artifact
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # Gradle's output path varies by target/flavour, so search rather than
                    # hard-code it.
                    $apk = Get-ChildItem 'src-tauri/gen/android/app/build/outputs/apk' -Recurse -Filter '*.apk' |
                        Select-Object -First 1
                    if (-not $apk) { throw "No .apk found under src-tauri/gen/android/app/build/outputs/apk" }

                    Copy-Item $apk.FullName (Join-Path $out "Disruptor-Proxy_${version}.apk")
                    Write-Host "Staged Android artifact: $($apk.Name)"

            -   uses: actions/upload-artifact@v4
                with:
                    name: android-assets
                    path: release-assets
                    if-no-files-found: error

    release:
        # Blocks on Linux and macOS on purpose: a release whose latest.json silently loses
        # a platform is worse than one that fails loudly and gets re-run. Android is
        # continue-on-error, so it satisfies `needs` whether or not it produced an APK.
        needs: [ linux, macos, android ]
        runs-on: windows-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm

            -   uses: dtolnay/rust-toolchain@stable

            -   run: npm ci

            # Turn Conventional Commits for this tag into release notes, reused by both
            # release bodies (below) and the updater's latest.json "notes".
            -   name: Generate release notes
                id: notes
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    npx --yes git-cliff@2 --config cliff.toml --current --output release-notes.md
                    $body = ''
                    if (Test-Path release-notes.md) { $body = (Get-Content -Raw release-notes.md).Trim() }
                    if (-not $body)
                    {
                        # No conventional commits in this range - don't ship an empty body.
                        $body = "Release ${{ github.ref_name }}"
                        Set-Content -Path release-notes.md -Value $body -Encoding utf8
                    }
                    # Multiline step output for tauri-action's releaseBody (string input).
                    $delim = "NOTES_" + [guid]::NewGuid().ToString('N')
                    "body<<$delim" | Add-Content -Path $env:GITHUB_OUTPUT
                    $body          | Add-Content -Path $env:GITHUB_OUTPUT
                    $delim         | Add-Content -Path $env:GITHUB_OUTPUT
                    Write-Host "--- release notes ---"
                    Write-Host $body

            # Builds + signs once, and publishes the private Core draft release.
            -   uses: tauri-apps/tauri-action@v0
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                with:
                    tagName: ${{ github.ref_name }}
                    releaseName: 'The Disruptor Proxy ${{ github.ref_name }}'
                    releaseBody: ${{ steps.notes.outputs.body }}
                    releaseDraft: true
                    prerelease: false

            # Every other platform's files, staged by their own jobs. merge-multiple drops
            # them into ./release-assets alongside the Windows ones, and the pattern makes a
            # missing android-assets (best-effort job) a non-event instead of a failure.
            -   name: Download the other platforms' artifacts
                uses: actions/download-artifact@v4
                with:
                    path: release-assets
                    pattern: '*-assets'
                    merge-multiple: true

            # Copies the installer + its .sig under predictable, space-free names into
            # ./release-assets, and writes a latest.json whose download URL points at
            # the Xray-Client (public) asset - the manifest the updater actually reads.
            -   name: Stage public artifacts and build latest.json
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')
                    $repo    = 'DisruptorProxy/Xray-Client'
                    $bundle  = 'src-tauri/target/release/bundle'

                    # NSIS installer is the Windows updater target.
                    $setup = Get-ChildItem "$bundle/nsis" | Where-Object { $_.Name -like '*-setup.exe' } | Select-Object -First 1
                    $sig   = Get-ChildItem "$bundle/nsis" | Where-Object { $_.Name -like '*-setup.exe.sig' } | Select-Object -First 1
                    if (-not $setup) { throw "NSIS installer not found under $bundle/nsis" }
                    if (-not $sig)   { throw "Updater signature (.sig) not found - is createUpdaterArtifacts enabled and signing configured?" }

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # Space-free names so the latest.json URL is predictable (GitHub
                    # mangles spaces in asset names, which would break the updater URL).
                    $exeName = "Disruptor-Proxy_${version}_x64-setup.exe"
                    Copy-Item $setup.FullName (Join-Path $out $exeName)
                    Copy-Item $sig.FullName   (Join-Path $out "$exeName.sig")

                    # Carry the MSI too, for direct downloads (not referenced by the updater).
                    $msi = Get-ChildItem "$bundle/msi" | Where-Object { $_.Name -like '*.msi' } | Select-Object -First 1
                    if ($msi) { Copy-Item $msi.FullName (Join-Path $out "Disruptor-Proxy_${version}_x64.msi") }

                    $notes = if (Test-Path 'release-notes.md') { (Get-Content -Raw 'release-notes.md').Trim() } else { "The Disruptor Proxy $version" }
                    $signature = (Get-Content -Raw $sig.FullName).Trim()

                    $platforms = [ordered]@{
                        'windows-x86_64' = [ordered]@{
                            signature = $signature
                            url       = "https://github.com/$repo/releases/download/$tag/$exeName"
                        }
                    }

                    # Linux and macOS came from their own jobs (downloaded above). Each entry
                    # is derived from whichever .sig actually arrived, so a URL can never
                    # drift from the file that was signed. The universal macOS build serves
                    # Apple Silicon and Intel alike - two keys, one asset.
                    $updaterAssets = @(
                        @{ Match = '*.AppImage*.sig';  Keys = @('linux-x86_64') },
                        @{ Match = '*.app.tar.gz.sig'; Keys = @('darwin-aarch64', 'darwin-x86_64') }
                    )
                    foreach ($asset in $updaterAssets)
                    {
                        $found = Get-ChildItem $out | Where-Object { $_.Name -like $asset.Match } | Select-Object -First 1
                        if (-not $found)
                        {
                            throw "No updater signature matching $($asset.Match) - did the $($asset.Keys -join '/') job upload its artifacts?"
                        }

                        $assetName = $found.Name -replace '\.sig$', ''
                        $assetSig  = (Get-Content -Raw $found.FullName).Trim()
                        foreach ($key in $asset.Keys)
                        {
                            $platforms[$key] = [ordered]@{
                                signature = $assetSig
                                url       = "https://github.com/$repo/releases/download/$tag/$assetName"
                            }
                        }
                    }

                    # The Android APK ships as a plain download - the Tauri updater has no
                    # Android channel, so it is deliberately absent from the manifest.
                    $manifest = [ordered]@{
                        version   = $version
                        notes     = $notes
                        pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                        platforms = $platforms
                    }
                    $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $out 'latest.json') -Encoding utf8

                    Write-Host "Staged for $repo @ ${tag}:"
                    Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

            # Publishes the public Xray-Client draft release - installer(s), the .sig,
            # the latest.json the updater reads, and the generated release notes.
            -   uses: softprops/action-gh-release@v2
                with:
                    repository: DisruptorProxy/Xray-Client
                    token: ${{ secrets.CLIENT_REPO_TOKEN }}
                    tag_name: ${{ github.ref_name }}
                    name: 'The Disruptor Proxy ${{ github.ref_name }}'
                    body_path: release-notes.md
                    draft: true
                    prerelease: false
                    fail_on_unmatched_files: true
                    files: |
                        release-assets/*
