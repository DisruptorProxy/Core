name: Release

# Pushing a `v*` tag builds, signs, and publishes a draft release ON THIS REPO
# (DisruptorProxy/Core) - there is no second repo and no mirror step. tauri.conf.json's
# updater endpoint points at Core/releases/latest/download/latest.json, so the release
# this workflow creates is the one the updater reads.
#
# Exactly four assets are built and attached, plus the updater manifest:
#   Disruptor-Proxy_<version>_x64-setup.exe       Windows NSIS installer (updater target)
#   Disruptor-Proxy_<version>_x64-setup.exe.sig   its updater signature
#   Disruptor-Proxy_<version>_amd64.deb           Linux direct download
#   Disruptor-Proxy_<version>.apk                 Android direct download
#   latest.json                                   the updater manifest
# Nothing else is bundled on purpose: no MSI, no AppImage, no macOS .app/.dmg. Because the
# AppImage was Linux's only updater target and macOS is gone, latest.json now covers
# `windows-x86_64` only - .deb and .apk users update by downloading the new file. macOS still
# builds in ci.yml, proving it bundles.
#
# Release notes are generated from Conventional Commits by git-cliff (cliff.toml) and spliced
# into the release body AND the updater's latest.json "notes". Checkout uses fetch-depth: 0 so
# git-cliff can see full history + tags.
#
# The manifest is built here rather than taken from Tauri's own: artifacts are renamed to
# space-free names first (productName is "Disruptor Proxy", and GitHub mangles spaces in asset
# names, which would break the URL the updater fetches), and latest.json has to reference those
# renamed assets. Android is absent from the manifest on purpose - the Tauri updater has no
# Android channel, so the APK is a plain download.
#
# The release is created as a DRAFT on purpose - review it on GitHub and publish it manually.
# A draft is invisible to the updater and to anonymous downloads (`releases/latest` only
# resolves to a PUBLISHED release), so a bad build never reaches anyone until you say so.
#
# Required secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the updater signing key (base64 of the .key
#                                        file, exactly as `tauri signer generate` wrote
#                                        it - do not reformat).
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password.
# The default GITHUB_TOKEN publishes the release; no cross-repo PAT is involved.

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    # Fails in seconds if this tag already has a PUBLISHED release, before ~15 minutes of
    # build time is spent on a run that cannot succeed.
    #
    # This repo has immutable releases enabled: once a release is published its assets are
    # frozen forever. Re-running a release for an already-published tag therefore uploads
    # nothing and dies with "Cannot upload asset ... to an immutable release" - and worse,
    # a release published while still empty can never be repaired, which breaks the
    # updater's `releases/latest/download/latest.json` for everyone. A tag gets exactly one
    # shot; if it was published early or badly, cut the next patch version.
    #
    # A DRAFT for the tag is fine and expected - re-running to replace a bad draft is
    # exactly the workflow this allows.
    guard:
        name: Check the tag is releasable
        runs-on: ubuntu-latest
        steps:
            -   name: Refuse to build for an already-published tag
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    TAG: ${{ github.ref_name }}
                run: |
                    state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                        --jq '.draft' 2>/dev/null || echo "none")

                    if [ "$state" = "false" ]; then
                        echo "::error::Release ${TAG} is already published and its assets are immutable."
                        echo "::error::Nothing can be added to it. Bump to the next patch version and tag that instead."
                        exit 1
                    fi

                    if [ "$state" = "true" ]; then
                        echo "A draft for ${TAG} already exists; it will be replaced."
                    else
                        echo "No release for ${TAG} yet."
                    fi

    # Linux builds on its own runner and hands its .deb to `release` as an artifact. Only
    # that job writes the release.
    linux:
        name: Build Linux (deb)
        needs: guard
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm

            -   uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

            -   name: Install Linux Tauri dependencies
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

            -   run: npm ci

            # Only the Windows core is committed; every other target's is fetched and
            # sha256-verified at build time.
            -   name: Fetch the Linux Xray core
                run: node scripts/fetch-core.mjs --target linux-64

            -   name: Build the .deb
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: npm run tauri build -- --bundles deb

            -   name: Stage the Linux artifact
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')
                    $bundle  = 'src-tauri/target/release/bundle'

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # The .deb is a direct download; the updater never uses it, so it needs
                    # no .sig - just a predictable, space-free name.
                    $deb = Get-ChildItem "$bundle/deb" -Filter '*.deb' | Select-Object -First 1
                    if (-not $deb) { throw "No .deb found under $bundle/deb" }

                    Copy-Item $deb.FullName (Join-Path $out "Disruptor-Proxy_${version}_amd64.deb")

                    Write-Host "Staged Linux artifact: $($deb.Name)"

            -   uses: actions/upload-artifact@v7
                with:
                    name: linux-assets
                    path: release-assets
                    if-no-files-found: error

    android:
        name: Build Android (apk)
        # Best-effort on purpose: the release APK is signed only when the keystore secrets
        # are present, and Android won't install an unsigned APK - so an unsigned build is
        # attached for testing rather than distribution. continue-on-error keeps a broken or
        # missing Android build from blocking a desktop release; `needs` is still satisfied.
        runs-on: ubuntu-latest
        needs: guard
        continue-on-error: true
        # `secrets` cannot be referenced from a step `if:`, but `env` can - so surface the
        # keystore secret the signing step gates on here, and test env.* below.
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm

            -   uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 17

            -   uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

            -   name: Install the Android NDK
                run: |
                    sdkmanager "ndk;27.0.12077973"
                    echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

            -   uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
                with:
                    targets: aarch64-linux-android,x86_64-linux-android

            -   name: Install Linux Tauri dependencies
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

            -   run: npm ci

            # The Android core is libXray's prebuilt gomobile AAR (Xray-core in-process); no
            # tun2socks and no per-ABI native build - the fd goes straight to Xray's tun inbound.
            -   name: Fetch the Android Xray core (libXray AAR)
                run: npm run fetch-core:android

            # Android refuses to install an unsigned APK. When these secrets are absent the
            # gradle config leaves the build unsigned rather than failing, so the job still
            # proves the APK assembles - it just is not installable.
            -   name: Restore the signing keystore
                if: env.ANDROID_KEYSTORE_BASE64 != ''
                shell: bash
                run: |
                    echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
                    echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

            -   name: Assemble the APK
                env:
                    ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                    ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                    ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                run: npm run tauri android build -- --apk

            -   name: Stage the Android artifact
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # Gradle's output path varies by target/flavour, so search rather than
                    # hard-code it.
                    $apk = Get-ChildItem 'src-tauri/gen/android/app/build/outputs/apk' -Recurse -Filter '*.apk' |
                        Select-Object -First 1
                    if (-not $apk) { throw "No .apk found under src-tauri/gen/android/app/build/outputs/apk" }

                    Copy-Item $apk.FullName (Join-Path $out "Disruptor-Proxy_${version}.apk")
                    Write-Host "Staged Android artifact: $($apk.Name)"

            -   uses: actions/upload-artifact@v7
                with:
                    name: android-assets
                    path: release-assets
                    if-no-files-found: error

    release:
        # Builds Windows, collects the other platforms' staged files, and publishes the one
        # draft release on this repo. Blocks on Linux on purpose - a release that silently
        # loses the .deb is worse than one that fails loudly and gets re-run. Android is
        # continue-on-error, so it satisfies `needs` whether or not it produced an APK.
        needs: [ guard, linux, android ]
        runs-on: windows-latest
        steps:
            # fetch-depth: 0 alone is not enough for git-cliff: actions/checkout fetches with
            # --no-tags, so without fetch-tags it sees only the tag being built and treats the
            # entire history as this release's changelog. Both are required.
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    fetch-tags: true

            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
                    cache: npm

            -   uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

            -   run: npm ci

            # Turn Conventional Commits for this tag into release notes, reused by both the
            # release body (below) and the updater's latest.json "notes".
            -   name: Generate release notes
                id: notes
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    npx --yes git-cliff@2 --config cliff.toml --current --output release-notes.md
                    $body = ''
                    if (Test-Path release-notes.md) { $body = (Get-Content -Raw release-notes.md).Trim() }
                    if (-not $body)
                    {
                        # No conventional commits in this range - don't ship an empty body.
                        $body = "Release ${{ github.ref_name }}"
                        Set-Content -Path release-notes.md -Value $body -Encoding utf8
                    }
                    Write-Host "--- release notes ---"
                    Write-Host $body

            # NSIS only - the MSI is not built. createUpdaterArtifacts in tauri.conf.json is
            # what produces the .sig beside the installer.
            -   name: Build and sign the NSIS installer
                env:
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: npm run tauri build -- --bundles nsis

            # The .deb and .apk, staged by their own jobs. merge-multiple drops them into
            # ./release-assets alongside the Windows ones, and the pattern makes a missing
            # android-assets (best-effort job) a non-event instead of a failure.
            -   name: Download the other platforms' artifacts
                uses: actions/download-artifact@v4
                with:
                    path: release-assets
                    pattern: '*-assets'
                    merge-multiple: true

            # Copies the installer + its .sig under predictable, space-free names into
            # ./release-assets, and writes the latest.json the updater reads - its URLs point
            # at this repo's assets for this tag.
            -   name: Stage public artifacts and build latest.json
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Stop'
                    $tag     = '${{ github.ref_name }}'
                    $version = $tag.TrimStart('v')
                    $repo    = '${{ github.repository }}'
                    $bundle  = 'src-tauri/target/release/bundle'

                    # NSIS installer is the Windows updater target.
                    $setup = Get-ChildItem "$bundle/nsis" | Where-Object { $_.Name -like '*-setup.exe' } | Select-Object -First 1
                    $sig   = Get-ChildItem "$bundle/nsis" | Where-Object { $_.Name -like '*-setup.exe.sig' } | Select-Object -First 1
                    if (-not $setup) { throw "NSIS installer not found under $bundle/nsis" }
                    if (-not $sig)   { throw "Updater signature (.sig) not found - is createUpdaterArtifacts enabled and signing configured?" }

                    $out = 'release-assets'
                    New-Item -ItemType Directory -Force -Path $out | Out-Null

                    # Space-free names so the latest.json URL is predictable (GitHub
                    # mangles spaces in asset names, which would break the updater URL).
                    $exeName = "Disruptor-Proxy_${version}_x64-setup.exe"
                    Copy-Item $setup.FullName (Join-Path $out $exeName)
                    Copy-Item $sig.FullName   (Join-Path $out "$exeName.sig")

                    $notes = if (Test-Path 'release-notes.md') { (Get-Content -Raw 'release-notes.md').Trim() } else { "Disruptor Proxy $version" }
                    $signature = (Get-Content -Raw $sig.FullName).Trim()

                    # Windows is the only updater platform: the AppImage (Linux's updater
                    # target) and the macOS .app are no longer built. The .deb and .apk ship
                    # as plain downloads - and the Tauri updater has no Android channel
                    # anyway.
                    $manifest = [ordered]@{
                        version   = $version
                        notes     = $notes
                        pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                        platforms = [ordered]@{
                            'windows-x86_64' = [ordered]@{
                                signature = $signature
                                url       = "https://github.com/$repo/releases/download/$tag/$exeName"
                            }
                        }
                    }
                    $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $out 'latest.json') -Encoding utf8

                    Write-Host "Staged for $repo @ ${tag}:"
                    Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

            # The one draft release, on this repo - installer, its .sig, the .deb, the .apk,
            # the latest.json the updater reads, and the generated release notes.
            -   uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    tag_name: ${{ github.ref_name }}
                    name: 'Disruptor Proxy ${{ github.ref_name }}'
                    body_path: release-notes.md
                    draft: true
                    prerelease: false
                    fail_on_unmatched_files: true
                    files: |
                        release-assets/*
