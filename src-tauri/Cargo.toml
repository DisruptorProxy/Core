[package]
name = "disruptor-proxy"
version = "1.8.2"
edition = "2021"

[lib]
name = "disruptor_proxy_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde_json = "1"
serde = { version = "1", features = [ "derive" ] }

tokio = { version = "1", features = [ "net", "time", "process" ] }
reqwest = { version = "0.12", default-features = false, features = [ "socks", "rustls-tls" ] }

# Not used directly - this is here purely to install a default crypto provider, see `run()`.
# `tauri-plugin-updater` enables reqwest's `rustls-no-provider` feature, and cargo unifies
# features across the whole graph, so *every* reqwest 0.13 client in the build ends up
# provider-less - including the one Tauri itself uses on mobile. Same version and features
# the updater already pulls in, so this adds nothing to the build.
rustls = { version = "0.23", default-features = false, features = [ "ring" ] }

# The Xray core runs as a child process holding the VpnService tun fd, which Kotlin cannot
# hand it (see src/android_core.rs). `jni` matches the version tauri already builds against;
# `libc` is only here for dup/close on the fd.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
libc = "0.2"

# No `windows` crate on Windows any more. It was here for `ShellExecuteExW` ("runas"),
# which elevated the core when the app itself ran unelevated. The app now requests
# `requireAdministrator` in its manifest, so `platform/windows.rs` spawns the core with
# plain `std::process::Command` and needs nothing from Win32 beyond `CommandExt`'s
# creation flags, which std provides.

[profile.dev]
incremental = true

[profile.release]
lto = true
strip = true
opt-level = 3
panic = "abort"
codegen-units = 1
